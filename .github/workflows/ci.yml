name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
      - "ZingPDF.sln"
      - "Directory.Build.props"
      - "scripts/assert-binary-fixtures.ps1"
      - "scripts/verify-runtime-consumers.ps1"
      - "website/assets/examples/first-pdf.zip"
  workflow_dispatch:

env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Show environment
        run: dotnet --info

      - name: Validate binary fixture checkout
        shell: pwsh
        run: ./scripts/assert-binary-fixtures.ps1

      - name: Restore
        run: dotnet restore ZingPDF.sln

      - name: Build
        run: dotnet build ZingPDF.sln --configuration Release --no-restore

      # The unit, integration, and smoke projects each target net8.0, net9.0, and net10.0.
      - name: Test all supported runtimes
        run: dotnet test ZingPDF.sln --configuration Release --no-build

      - name: Verify published-package consumers on .NET 8, 9, and 10
        shell: pwsh
        run: ./scripts/verify-runtime-consumers.ps1
