name: Invoice rendering

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/ZingPDF/**'
      - 'src/ZingPDF.FromHTML/**'
      - 'src/ZingPDF.Templates/**'
      - 'src/ZingPDF.Templates.LiquidHtml/**'
      - 'tests/ZingPDF.Tests.Integration/HtmlToPdfRendererTests.cs'
      - 'tests/TestFiles/font/NotoSans-Regular.ttf'
      - 'examples/GenerateInvoices/**'
      - 'scripts/verify-invoices*'
      - 'Directory.Build.props'
      - '.github/workflows/invoice-rendering.yml'

permissions:
  contents: read

jobs:
  linux-invoices:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF reader
        run: python -m pip install pypdf==6.10.0
      - name: Check provisioned browser
        run: |
          test "$(id -u)" -ne 0
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - name: Browser integration tests
        env:
          ZINGPDF_BROWSER_PATH: /usr/bin/google-chrome
        run: dotnet test tests/ZingPDF.Tests.Integration/ZingPDF.Tests.Integration.csproj --configuration Release --filter FullyQualifiedName~HtmlToPdfRendererTests --logger "trx;LogFileName=browser.trx" --results-directory .tools/invoice-tests
      - name: Offline non-root Linux container corpus
        shell: pwsh
        run: ./scripts/verify-invoices-linux.ps1
      - name: Preserve invoice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-invoice-evidence
          path: |
            .tools/invoice-linux/
            .tools/invoice-tests/
          if-no-files-found: warn
