name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "Directory.Build.props"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Optional version expected in Directory.Build.props (for example 2.0.0)"
        required: false
        default: ""
      publish_nuget:
        description: "Publish packages to NuGet"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect release-affecting changes
        id: changes
        shell: pwsh
        run: |
          $tags = @(git tag --list "v*")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read git tags."
          }

          $latestTag = $tags |
            Where-Object { $_ -and $_.Trim().TrimStart('v') -match '^\d+\.\d+\.\d+$' } |
            ForEach-Object {
              [PSCustomObject]@{
                Tag = $_.Trim()
                Version = [version]$_.Trim().TrimStart('v')
              }
            } |
            Sort-Object Version -Descending |
            Select-Object -ExpandProperty Tag -First 1

          if ([string]::IsNullOrWhiteSpace($latestTag)) {
            "has_release_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $changedFiles = @(git diff --name-only "$latestTag..HEAD" -- `
            src/ZingPDF `
            src/ZingPDF.Fonts `
            src/ZingPDF.FromHTML `
            src/ZingPDF.GoogleFonts `
            src/ZingPDF.OCR `
            src/ZingPDF.Templates `
            src/ZingPDF.Templates.LiquidHtml `
            src/ZingPDF.InheritableSourceGenerator `
            tests `
            scripts `
            .github/workflows/release.yml `
            .github/release.yml `
            ZingPDF.sln `
            Directory.Build.props `
            CHANGELOG.md `
            LICENSE.txt `
            docs/packages `
            docs/project/SUPPORT.md)

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect changed files since $latestTag."
          }

          $ignoredPaths = @(
            'scripts/compare-performance.ps1'
            'scripts/run-competitive-performance.ps1'
            'scripts/run-performance.ps1'
            'scripts/update-performance-pages.ps1'
            'scripts/write-competitive-summary.ps1'
            'scripts/write-performance-summary.ps1'
          )

          $releaseChangedFiles = @($changedFiles | Where-Object { $_ -notin $ignoredPaths })

          if ($releaseChangedFiles.Count -eq 0 -and $changedFiles.Count -gt 0) {
            Write-Host "Ignoring benchmark/reporting-only changes:"
            $changedFiles | ForEach-Object { Write-Host " - $_" }
          }

          $hasReleaseChanges = $releaseChangedFiles.Count -gt 0
          "has_release_changes=$($hasReleaseChanges.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Stop when no release-affecting changes were found
        if: ${{ steps.changes.outputs.has_release_changes != 'true' }}
        shell: pwsh
        run: |
          Write-Host "No release-affecting changes found since the latest release tag."

      - name: Setup .NET
        if: ${{ steps.changes.outputs.has_release_changes == 'true' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate binary fixture checkout
        if: ${{ steps.changes.outputs.has_release_changes == 'true' }}
        shell: pwsh
        run: ./scripts/assert-binary-fixtures.ps1

      - name: Read release metadata
        if: ${{ steps.changes.outputs.has_release_changes == 'true' }}
        id: metadata
        shell: pwsh
        run: |
          $propsContent = Get-Content Directory.Build.props -Raw
          $versionMatch = [regex]::Match($propsContent, '<VersionBase>(?<version>\d+\.\d+\.\d+)</VersionBase>')
          if (-not $versionMatch.Success) {
            throw "Directory.Build.props must define VersionBase."
          }

          $version = $versionMatch.Groups['version'].Value
          $expectedVersion = '${{ github.event.inputs.expected_version }}'.Trim()
          if (-not [string]::IsNullOrWhiteSpace($expectedVersion) -and $expectedVersion -ne $version) {
            throw "Expected version '$expectedVersion' does not match VersionBase '$version'."
          }

          $tags = @(git tag --list "v*")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read git tags."
          }

          $latestTag = $tags |
            Where-Object { $_ -and $_.Trim().TrimStart('v') -match '^\d+\.\d+\.\d+$' } |
            ForEach-Object {
              [PSCustomObject]@{
                Tag = $_.Trim()
                Version = [version]$_.Trim().TrimStart('v')
              }
            } |
            Sort-Object Version -Descending |
            Select-Object -First 1

          if ($null -ne $latestTag -and ([version]$version).CompareTo($latestTag.Version) -le 0) {
            Write-Host "VersionBase '$version' is not newer than latest release tag '$($latestTag.Tag)'."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $existingTag = git tag --list "v$version"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify whether release tag v$version already exists."
          }
          if (-not [string]::IsNullOrWhiteSpace(($existingTag | Select-Object -First 1))) {
            throw "Release tag v$version already exists."
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch "(?m)^## \[$([regex]::Escape($version))\] - \d{4}-\d{2}-\d{2}$") {
            Write-Host "CHANGELOG.md does not contain a release section for $version."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "assembly_version=$version.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Stop when release metadata has not been prepared
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release != 'true' }}
        shell: pwsh
        run: |
          Write-Host "Release metadata has not been prepared. Merge a release-preparation PR first."

      - name: Restore
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        run: dotnet restore ZingPDF.sln

      - name: Build
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        run: >
          dotnet build ZingPDF.sln
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.metadata.outputs.version }}
          -p:AssemblyVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:FileVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.metadata.outputs.version }}

      - name: Test
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        run: dotnet test ZingPDF.sln --configuration Release --no-build

      - name: Pack core package
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        run: >
          dotnet pack src/ZingPDF/ZingPDF.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ steps.metadata.outputs.version }}
          -p:Version=${{ steps.metadata.outputs.version }}
          -p:AssemblyVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:FileVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.metadata.outputs.version }}

      - name: Pack HTML package
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        run: >
          dotnet pack src/ZingPDF.FromHTML/ZingPDF.FromHTML.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ steps.metadata.outputs.version }}
          -p:Version=${{ steps.metadata.outputs.version }}
          -p:AssemblyVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:FileVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.metadata.outputs.version }}

      - name: Pack Google Fonts package
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        run: >
          dotnet pack src/ZingPDF.GoogleFonts/ZingPDF.GoogleFonts.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ steps.metadata.outputs.version }}
          -p:Version=${{ steps.metadata.outputs.version }}
          -p:AssemblyVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:FileVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.metadata.outputs.version }}

      - name: Pack OCR package
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        run: >
          dotnet pack src/ZingPDF.OCR/ZingPDF.OCR.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:PackageVersion=${{ steps.metadata.outputs.version }}
          -p:Version=${{ steps.metadata.outputs.version }}
          -p:AssemblyVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:FileVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.metadata.outputs.version }}

      - name: Pack templates package
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        run: >
          dotnet pack src/ZingPDF.Templates/ZingPDF.Templates.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ steps.metadata.outputs.version }}
          -p:Version=${{ steps.metadata.outputs.version }}
          -p:AssemblyVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:FileVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.metadata.outputs.version }}

      - name: Pack Liquid HTML templates package
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        run: >
          dotnet pack src/ZingPDF.Templates.LiquidHtml/ZingPDF.Templates.LiquidHtml.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ steps.metadata.outputs.version }}
          -p:Version=${{ steps.metadata.outputs.version }}
          -p:AssemblyVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:FileVersion=${{ steps.metadata.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.metadata.outputs.version }}

      - name: Upload packages
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: zingpdf-packages-${{ steps.metadata.outputs.version }}
          path: artifacts/packages/*
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ZingPDF ${{ steps.metadata.outputs.tag }}
          generate_release_notes: true
          files: artifacts/packages/*

      - name: NuGet login (OIDC)
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' && (github.event_name == 'push' || github.event.inputs.publish_nuget == 'true') }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: ${{ steps.changes.outputs.has_release_changes == 'true' && steps.metadata.outputs.should_release == 'true' && (github.event_name == 'push' || github.event.inputs.publish_nuget == 'true') }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts/packages -Filter *.nupkg | Where-Object { $_.Name -notlike '*.snupkg' }
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were found to publish."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          }
