name: Prepare Release

on:
  push:
    branches:
      - main
    paths:
      - "src/ZingPDF/**"
      - "src/ZingPDF.Fonts/**"
      - "src/ZingPDF.FromHTML/**"
      - "src/ZingPDF.GoogleFonts/**"
      - "src/ZingPDF.OCR/**"
      - "src/ZingPDF.Templates/**"
      - "src/ZingPDF.Templates.LiquidHtml/**"
      - "src/ZingPDF.InheritableSourceGenerator/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/prepare-release.yml"
      - ".github/release.yml"
      - "ZingPDF.sln"
      - "Directory.Build.props"
      - "CHANGELOG.md"
      - "LICENSE.txt"
      - "docs/packages/**"
      - "docs/project/SUPPORT.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional manual release version override (for example 2.0.0)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check existing release metadata
        id: metadata
        shell: pwsh
        run: |
          $propsContent = Get-Content Directory.Build.props -Raw
          $versionMatch = [regex]::Match($propsContent, '<VersionBase>(?<version>\d+\.\d+\.\d+)</VersionBase>')
          if (-not $versionMatch.Success) {
            throw "Directory.Build.props must define VersionBase."
          }

          $version = $versionMatch.Groups['version'].Value
          $tags = @(git tag --list "v*")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read git tags."
          }

          $latestTag = $tags |
            Where-Object { $_ -and $_.Trim().TrimStart('v') -match '^\d+\.\d+\.\d+$' } |
            ForEach-Object {
              [PSCustomObject]@{
                Tag = $_.Trim()
                Version = [version]$_.Trim().TrimStart('v')
              }
            } |
            Sort-Object Version -Descending |
            Select-Object -First 1

          if ($null -eq $latestTag -or ([version]$version).CompareTo($latestTag.Version) -le 0) {
            "release_ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          $hasChangelogSection = $changelog -match "(?m)^## \[$([regex]::Escape($version))\] - \d{4}-\d{2}-\d{2}$"
          "release_ready=$($hasChangelogSection.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($hasChangelogSection) {
            Write-Host "Release metadata for $version is already prepared."
          }

      - name: Prepare release metadata
        if: ${{ steps.metadata.outputs.release_ready != 'true' }}
        id: prepare
        shell: pwsh
        run: ./scripts/prepare-release.ps1 -OverrideVersion '${{ github.event.inputs.version }}'

      - name: Stop when no releasable changes were found
        if: ${{ steps.metadata.outputs.release_ready != 'true' && steps.prepare.outputs.should_release != 'true' }}
        shell: pwsh
        run: |
          Write-Host "No releasable changes found in CHANGELOG.md or commit history."

      - name: Open release preparation pull request
        if: ${{ steps.metadata.outputs.release_ready != 'true' && steps.prepare.outputs.should_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '${{ steps.prepare.outputs.version }}'
          $branchName = "release/prepare-v$version"
          $title = "chore(release): prepare $version"
          $body = @"
          Prepares release metadata for v$version.

          This PR was generated by the Prepare Release workflow. Review the `CHANGELOG.md` entries before merging. The Release workflow publishes packages after this PR is merged.
          "@

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B $branchName
          git add Directory.Build.props CHANGELOG.md

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release metadata is already up to date."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Unable to inspect staged release metadata."
          }

          git commit -m $title
          git push --force-with-lease origin $branchName

          $prNumber = gh pr list --head $branchName --base main --state open --json number --jq '.[0].number'
          if ([string]::IsNullOrWhiteSpace($prNumber)) {
            gh pr create --base main --head $branchName --title $title --body $body
          }
          else {
            gh pr edit $prNumber --title $title --body $body
            Write-Host "Updated existing pull request #$prNumber."
          }
