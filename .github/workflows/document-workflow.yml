name: Linux document workflow OCR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/ZingPDF.OCR/**'
      - 'src/ZingPDF/Elements/Forms/**'
      - 'src/ZingPDF/InteractiveFeatures/**'
      - 'src/ZingPDF/Logging/**'
      - 'src/ZingPDF/Rendering/**'
      - 'src/ZingPDF/Elements/Page.cs'
      - 'src/ZingPDF/Pdf.cs'
      - 'src/ZingPDF/IPdf.cs'
      - 'examples/VerifyDocumentWorkflow/**'
      - 'examples/VerifyFormAppearances/**'
      - 'scripts/verify-document-workflow*'
      - 'scripts/verify-form-appearances.py'
      - 'tests/ZingPDF.Tests.Smoke/OcrRenderedPageTests.cs'
      - 'tests/ZingPDF.Tests.Smoke/ExternalFormFlatteningTests.cs'
      - 'tests/ZingPDF.Tests.Unit/Rendering/**'
      - 'Directory.Build.props'
      - 'tests/TestFiles/font/NotoSans-Regular.ttf'
      - '.github/workflows/document-workflow.yml'

permissions:
  contents: read

concurrency:
  group: linux-document-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-form-appearances:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent readers
        run: |
          python -m pip install pypdf==6.10.0
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Generate parsed external form outputs
        run: dotnet run --project examples/VerifyFormAppearances --configuration Release -- .tools/form-appearances
      - name: Compare values and independent renders
        run: python scripts/verify-form-appearances.py .tools/form-appearances
      - name: Preserve form appearance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-form-appearance-evidence
          path: .tools/form-appearances/
          if-no-files-found: warn
  linux-document-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF verifier
        run: python -m pip install pypdf==6.10.0
      - name: Offline non-root PDFium and Tesseract corpus
        shell: pwsh
        run: ./scripts/verify-document-workflow-linux.ps1
      - name: Preserve OCR evidence and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-document-workflow-ocr-evidence
          path: .tools/document-workflow-linux/
          if-no-files-found: warn
